<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Grand Royal Gameweek: Studio Set">
<meta property="og:image" content="assets/preview.jpg">
<title>Grand Royal Gameweek Studio Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&family=EB+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --rg:#e5b83d; --rb:#1f295c; --ink:#f3ece3; --bg:#0b0b0c; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; font-family:"Red Hat Display", system-ui, sans-serif; }
  #stage { position:relative; width:100%; height:100%; min-height:520px; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:absolute; left:16px; top:14px; color:var(--ink); pointer-events:none; }
  .hud h1 { margin:0; font:700 20px/1.1 "EB Garamond", Georgia, serif; letter-spacing:.01em; }
  .hud p { margin:4px 0 0; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--rg); }
  .bar { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:calc(100% - 32px); }
  .bar button { font:500 13px/1 "Red Hat Display", system-ui, sans-serif; color:var(--ink); background:rgba(20,20,24,.78); border:1px solid rgba(229,184,61,.45); padding:9px 13px; border-radius:2px; cursor:pointer; backdrop-filter:blur(6px); }
  .bar button[aria-pressed="true"] { background:var(--rg); color:var(--rb); border-color:var(--rg); }
  .bar button:focus-visible { outline:2px solid var(--rg); outline-offset:2px; }
  .hint { position:absolute; right:16px; top:16px; font-size:12px; color:rgba(243,236,227,.6); pointer-events:none; }
  #load { position:absolute; inset:0; display:grid; place-items:center; color:var(--rg); font-size:13px; letter-spacing:.2em; text-transform:uppercase; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="load">Building the set…</div>
  <div class="hud"><h1>Grand Royal Gameweek</h1><p>Studio set · final</p></div>
  <div class="hint">Drag to orbit · scroll to zoom</div>
  <div class="bar" role="toolbar" aria-label="Camera views">
    <button data-view="front" aria-pressed="true">Front</button>
    <button data-view="left">Left · KV &amp; rack</button>
    <button data-view="right">Right · Brand KV</button>
    <button data-view="host">Host seat</button>
    <button data-view="top">Plan</button>
    <button id="dims" aria-pressed="false">Dimensions</button>
    <button id="spin" aria-pressed="false">Turntable</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---- sources: the design system's own files ---- */
const TEX = {"kvWall": "assets/master-kv-wall.jpg", "rack": "assets/display-rack.jpg", "logo": "assets/gameweek-logo.png"};

/* ---- set dimensions, in feet (backdrop 8 ft, side walls 4 ft, curtains 4 ft) ---- */
const H = 6.5;                 // wall height, estimated from the photo
const SPLAY = THREE.MathUtils.degToRad(10);   // side walls open slightly toward camera
const CURTAIN_SPLAY = THREE.MathUtils.degToRad(38);
const GOLD = 0xe5b83d, BLUE = 0x1f295c;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
scene.fog = new THREE.Fog(0x0b0b0c, 22, 40);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 3; controls.maxDistance = 24;

const loader = new THREE.TextureLoader();
const loadTex = (url) => new Promise((res, rej) => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t); }, undefined, rej));
const loadImg = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });

const std = (o) => new THREE.MeshStandardMaterial(o);
const M = {
  oak: std({ color:0xc8915f, roughness:.62 }),
  oakDark: std({ color:0x3b2416, roughness:.9 }),
  velvet: std({ color:0x111114, roughness:1 }),
  brass: std({ color:0xc9a24a, metalness:.95, roughness:.28 }),
  black: std({ color:0x0d0d0f, metalness:.6, roughness:.35 }),
  walnut: std({ color:0x7a3f22, roughness:.42 }),
  carpet: std({ color:0x46505f, roughness:1 }),
  ceiling: std({ color:0x2a2928, roughness:1 }),
  curtain: std({ color:0x857c5c, roughness:.75, metalness:.05, side:THREE.DoubleSide }),
  white: std({ color:0xf1efea, roughness:.5 }),
  leaf: std({ color:0x4f7a46, roughness:.7 }),
  gold: std({ color:GOLD, roughness:.45 }),
  goldDeep: std({ color:0xb88c2a, roughness:.5 }),
  wallEdge: std({ color:0x1c1a18, roughness:.8 }),
};

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

async function build() {
  await Promise.all([document.fonts.load('700 120px "Red Hat Display"'), document.fonts.load('500 40px "Red Hat Display"')]).catch(()=>{});
  const [kvWall, rackTex, logoImg] = await Promise.all([loadTex(TEX.kvWall), loadTex(TEX.rack), loadImg(TEX.logo)]);

  /* floor + ceiling */
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(18, 14), M.carpet);
  floor.rotation.x = -Math.PI/2; floor.position.set(0, 0, 4.5); floor.receiveShadow = true; scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(16, 10), M.ceiling);
  ceil.rotation.x = Math.PI/2; ceil.position.set(0, H, 3.5); scene.add(ceil);

  /* ---- main backdrop: 8 ft slatted oak ---- */
  const back = new THREE.Mesh(new THREE.BoxGeometry(8, H, .12), M.oakDark);
  back.position.set(0, H/2, -.06); back.receiveShadow = true; scene.add(back);
  const SLATS = 44, pitch = 8 / SLATS, slatGeo = new THREE.BoxGeometry(pitch * .62, H, .09);
  const slats = new THREE.InstancedMesh(slatGeo, M.oak, SLATS);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  for (let i = 0; i < SLATS; i++) {
    m4.makeTranslation(-4 + pitch * (i + .5), H/2, .045); slats.setMatrixAt(i, m4);
    col.setHSL(.075, .45, .52 + (Math.sin(i * 12.9898) * 43758.5453 % 1) * .05); slats.setColorAt(i, col);
  }
  slats.receiveShadow = true; scene.add(slats);

  /* ---- centre lightbox: program logo, ~38 in across ---- */
  const R = 1.58, LB_Y = 4.25;
  const faceTex = canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#050505'; g.fillRect(0, 0, w, h);
    const sx = 212, sy = 181, sw = 1204, sh = 585, dw = 860, dh = dw * sh / sw;
    g.drawImage(logoImg, sx, sy, sw, sh, (w - dw)/2, (h - dh)/2 + 10, dw, dh);
  });
  const lb = new THREE.Group(); lb.position.set(0, LB_Y, .14); scene.add(lb);
  const can = new THREE.Mesh(new THREE.CylinderGeometry(R, R, .28, 96, 1, true), M.black);
  can.rotation.x = Math.PI/2; lb.add(can);
  const face = new THREE.Mesh(new THREE.CircleGeometry(R, 96), new THREE.MeshStandardMaterial({ map:faceTex, emissiveMap:faceTex, emissive:0xffffff, emissiveIntensity:1.15, roughness:.3 }));
  face.position.z = .141; lb.add(face);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(R, .045, 16, 128), std({ color:GOLD, metalness:.9, roughness:.25, emissive:0x7a5a10, emissiveIntensity:.6 }));
  rim.position.z = .15; lb.add(rim);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(R*3.4, R*3.4), new THREE.MeshBasicMaterial({
    map: canvasTex(512, 512, (g, w) => { const gr = g.createRadialGradient(w/2, w/2, w*.28, w/2, w/2, w/2); gr.addColorStop(0, 'rgba(255,196,90,.85)'); gr.addColorStop(.35, 'rgba(255,170,60,.35)'); gr.addColorStop(1, 'rgba(255,150,40,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w); }),
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
  halo.position.set(0, LB_Y, .1); scene.add(halo);
  const glow = new THREE.PointLight(0xffc35a, 9, 7, 1.6); glow.position.set(0, LB_Y, .9); scene.add(glow);

  /* ---- side walls: 4 ft each ---- */
  const brandTex = canvasTex(1200, 1950, (g, w, h) => {
    g.fillStyle = '#f4f1ea'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#1f295c'; g.lineWidth = 8; g.setLineDash([48, 30]); g.strokeRect(60, 60, w - 120, h - 120);
    g.fillStyle = '#1f295c'; g.textAlign = 'center';
    g.font = '700 150px "Red Hat Display", Arial, sans-serif'; g.fillText('BRAND KV', w/2, h*.44);
    g.font = '500 54px "Red Hat Display", Arial, sans-serif'; g.fillText('4 ft wall · artwork to come', w/2, h*.44 + 100);
  });
  function sideWall(side, tex) {             // side: -1 left, +1 right
    const hinge = new THREE.Vector3(4 * side, 0, 0);
    const dir = new THREE.Vector3(Math.sin(SPLAY) * side, 0, Math.cos(SPLAY));
    const g = new THREE.Group();
    g.position.copy(hinge).addScaledVector(dir, 2); g.position.y = H/2;
    g.rotation.y = side < 0 ? (Math.PI/2 - SPLAY) : -(Math.PI/2 - SPLAY);
    const mats = [M.wallEdge, M.wallEdge, M.wallEdge, M.wallEdge, std({ map:tex, roughness:.85 }), M.wallEdge];
    const box = new THREE.Mesh(new THREE.BoxGeometry(4, H, .16), mats);
    box.position.z = -.08; box.receiveShadow = true; g.add(box); scene.add(g);
    return hinge.clone().addScaledVector(dir, 4);   // outer end
  }
  const endL = sideWall(-1, kvWall);
  const endR = sideWall(+1, brandTex);

  /* ---- curtains: 4 ft each, pleated ---- */
  function curtain(start, side) {
    const dir = new THREE.Vector3(Math.sin(CURTAIN_SPLAY) * side, 0, Math.cos(CURTAIN_SPLAY));
    const geo = new THREE.PlaneGeometry(4, H, 160, 1), p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) { const x = p.getX(i); p.setZ(i, .11 * Math.sin(x * 9.4) + .04 * Math.sin(x * 23 + 1)); }
    geo.computeVertexNormals();
    const c = new THREE.Mesh(geo, M.curtain);
    c.position.copy(start).addScaledVector(dir, 2); c.position.y = H/2;
    c.rotation.y = side < 0 ? (Math.PI/2 - CURTAIN_SPLAY) : -(Math.PI/2 - CURTAIN_SPLAY);
    c.castShadow = c.receiveShadow = true; scene.add(c);
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, 4.2, 12), M.black);
    rod.rotation.z = Math.PI/2; rod.position.set(0, H/2 - .05, .2); c.add(rod);
    return { start, dir };
  }
  const cL = curtain(endL, -1); curtain(endR, +1);

  /* ---- display rack (guidelines p43), left side after the KV, at the curtain ---- */
  const RW = 1.8, RH = 6.0, RD = 1.15;
  const rack = new THREE.Mesh(new THREE.BoxGeometry(RW, RH, RD), [M.goldDeep, M.goldDeep, M.gold, M.goldDeep, std({ map:rackTex, roughness:.5 }), M.goldDeep]);
  const inward = new THREE.Vector3(Math.cos(CURTAIN_SPLAY), 0, Math.sin(CURTAIN_SPLAY));   // off the curtain, into the room
  const rackPos = cL.start.clone().addScaledVector(cL.dir, 2.6).addScaledVector(inward, .6);
  rack.position.set(rackPos.x, RH/2, rackPos.z);
  const look = new THREE.Vector3(1.2, 0, 9).sub(rackPos); rack.rotation.y = Math.atan2(look.x, look.z);
  rack.castShadow = rack.receiveShadow = true; scene.add(rack);
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(RW + .1, .12, RD + .1), M.black);
  plinth.position.set(rackPos.x, .06, rackPos.z); plinth.rotation.y = rack.rotation.y; scene.add(plinth);

  /* ---- track lights ---- */
  const rail = new THREE.Mesh(new THREE.BoxGeometry(5.6, .08, .1), M.black); rail.position.set(0, H - .06, 1.15); scene.add(rail);
  [[-2.3, -2.6], [-.85, -1.4], [.85, 1.4], [2.3, 2.6]].forEach(([x, tx], i) => {
    const target = new THREE.Object3D(); target.position.set(tx, 3.2, 0); scene.add(target);
    const head = new THREE.Mesh(new THREE.CylinderGeometry(.13, .16, .5, 24), M.black);
    head.position.set(x, H - .38, 1.15); head.lookAt(target.position); head.rotateX(Math.PI/2); scene.add(head);
    const lens = new THREE.Mesh(new THREE.CircleGeometry(.12, 24), new THREE.MeshBasicMaterial({ color:0xfff4dc }));
    lens.position.set(0, -.255, 0); lens.rotation.x = Math.PI/2; head.add(lens);
    const s = new THREE.SpotLight(0xffe0b0, 55, 16, .55, .7, 1.4);
    s.position.set(x, H - .45, 1.15); s.target = target;
    if (i === 1 || i === 2) { s.castShadow = true; s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -.0004; }
    scene.add(s);
  });

  /* ---- three tub chairs + round table ---- */
  const velvet = new THREE.MeshPhysicalMaterial({ color:0x202028, roughness:.92, sheen:1, sheenRoughness:.4, sheenColor:new THREE.Color(0x8a8a99), side:THREE.DoubleSide });
  function chair(x, z, yaw) {
    // open-front tub chair: back wraps 234 degrees, the gap faces +z (forward)
    const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = yaw;
    const T0 = Math.PI * .35, TL = Math.PI * 1.3;
    const seat = new THREE.Mesh(new THREE.CylinderGeometry(.92, .86, .36, 48), velvet); seat.position.y = 1.36; g.add(seat);
    const cushion = new THREE.Mesh(new THREE.SphereGeometry(.9, 48, 12, 0, Math.PI*2, 0, Math.PI*.12), velvet); cushion.position.y = 1.12; g.add(cushion);
    const backM = new THREE.Mesh(new THREE.CylinderGeometry(.98, .9, 1.05, 72, 6, true, T0, TL), velvet); backM.position.y = 1.98; g.add(backM);
    const inner = new THREE.Mesh(new THREE.CylinderGeometry(.84, .8, 1.0, 72, 6, true, T0, TL), velvet); inner.position.y = 1.98; g.add(inner);
    const roll = new THREE.Mesh(new THREE.TorusGeometry(.91, .085, 14, 72, TL), velvet);
    roll.rotation.set(Math.PI/2, 0, -(T0 + TL) + Math.PI/2); roll.position.y = 2.5; g.add(roll);
    for (let k = 0; k < 9; k++) {           // channel stitching on the back
      const a = T0 + TL * (k + .5) / 9;
      const rib = new THREE.Mesh(new THREE.CylinderGeometry(.018, .018, .95, 6), std({ color:0x0a0a0c, roughness:1 }));
      rib.position.set(Math.sin(a) * .99, 1.98, Math.cos(a) * .99); g.add(rib);
    }
    const arm = new THREE.Mesh(new THREE.TorusGeometry(1.03, .026, 10, 72, TL + .25), M.brass);
    arm.rotation.set(Math.PI/2, 0, -(T0 + TL + .125) + Math.PI/2); arm.position.y = 1.78; g.add(arm);
    [[.62, .5], [-.62, .5], [.6, -.62], [-.6, -.62]].forEach(([lx, lz]) => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(.024, .024, 1.82, 8), M.brass); leg.position.set(lx * 1.08, .91, lz * 1.08); g.add(leg);
    });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.7, .02, 8, 48), M.brass); ring.rotation.x = Math.PI/2; ring.position.y = 1.12; g.add(ring);
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); scene.add(g);
  }
  chair(0, 1.75, 0);
  chair(-2.85, 4.05, Math.PI * .34);
  chair(2.85, 4.05, -Math.PI * .34);
  const table = new THREE.Group(); table.position.set(0, 0, 3.85); scene.add(table);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, .1, 64), M.walnut); top.position.y = 1.72; table.add(top);
  const edge = new THREE.Mesh(new THREE.TorusGeometry(1.25, .035, 8, 64), M.black); edge.rotation.x = Math.PI/2; edge.position.y = 1.67; table.add(edge);
  [1.6, .04].forEach(y => { const r = new THREE.Mesh(new THREE.TorusGeometry(.95, .03, 8, 64), M.black); r.rotation.x = Math.PI/2; r.position.y = y; table.add(r); });
  for (let i = 0; i < 3; i++) { const a = i * Math.PI * 2 / 3 + .3; const rod = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, 1.6, 8), M.black); rod.position.set(Math.cos(a) * .95, .82, Math.sin(a) * .95); table.add(rod); }
  table.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });

  /* ---- plant on a white plinth, as in the studio ---- */
  const ped = new THREE.Mesh(new THREE.BoxGeometry(.75, 1.9, .75), M.white); ped.position.set(-1.35, .95, .75); ped.castShadow = ped.receiveShadow = true; scene.add(ped);
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(.2, .16, .32, 24), M.black); pot.position.set(-1.35, 2.06, .75); scene.add(pot);
  for (let i = 0; i < 9; i++) {
    const lf = new THREE.Mesh(new THREE.ConeGeometry(.06, .75, 6), M.leaf);
    const a = i / 9 * Math.PI * 2; lf.position.set(-1.35 + Math.cos(a) * .08, 2.5, .75 + Math.sin(a) * .08);
    lf.rotation.set(Math.sin(a) * .5, 0, -Math.cos(a) * .5); scene.add(lf);
  }

  /* ---- room light ---- */
  scene.add(new THREE.HemisphereLight(0xfff0dc, 0x232833, .55));
  const fill = new THREE.DirectionalLight(0xffe6c8, .55); fill.position.set(2, 5, 12); scene.add(fill);
  const rackLight = new THREE.SpotLight(0xfff0d8, 30, 12, .45, .8, 1.3);
  rackLight.position.set(rackPos.x + 2.2, H - .2, rackPos.z + 2.4); rackLight.target = rack; scene.add(rackLight);

  /* ---- dimension guides ---- */
  const dims = new THREE.Group(); dims.visible = false; scene.add(dims);
  const lineM = new THREE.LineBasicMaterial({ color:GOLD });
  function label(text, pos) {
    const t = canvasTex(512, 128, (g, w, h) => { g.fillStyle = 'rgba(11,11,12,.82)'; g.fillRect(0, 0, w, h); g.strokeStyle = '#e5b83d'; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4); g.fillStyle = '#f3ece3'; g.font = '600 52px "Red Hat Display", Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w/2, h/2 + 2); });
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, depthTest:false })); s.scale.set(1.9, .475, 1); s.position.copy(pos); s.renderOrder = 10; dims.add(s);
  }
  function seg(a, b, text) {
    a = a.clone(); b = b.clone(); a.y = b.y = .03;
    dims.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), lineM));
    label(text, a.clone().lerp(b, .5).add(new THREE.Vector3(0, .5, 0)));
  }
  const bl = new THREE.Vector3(-4, 0, .25), br = new THREE.Vector3(4, 0, .25);
  seg(bl, br, 'Backdrop 8 ft');
  seg(new THREE.Vector3(-4, 0, 0), endL, 'Master KV 4 ft');
  seg(new THREE.Vector3(4, 0, 0), endR, 'Brand KV 4 ft');
  seg(endL, endL.clone().addScaledVector(cL.dir, 4), 'Curtain 4 ft');
  seg(endR, endR.clone().add(new THREE.Vector3(Math.sin(CURTAIN_SPLAY) * 4, 0, Math.cos(CURTAIN_SPLAY) * 4)), 'Curtain 4 ft');
  label('Lightbox Ø 38 in', new THREE.Vector3(0, LB_Y + R + .45, .4));
  label('Display rack 1.8 × 6 ft', new THREE.Vector3(rackPos.x, RH + .45, rackPos.z));

  document.getElementById('load').remove();
  return { rackPos };
}

/* ---- camera views ---- */
const VIEWS = {
  front: { p:[-0.4, 4.6, 18.5], t:[-0.4, 2.9, 2.4] },
  left:  { p:[3.4, 4.1, 12.2], t:[-4.9, 3.0, 3.6] },
  right: { p:[-3.2, 4.0, 9.8], t:[4.2, 3.1, 2.4] },
  host:  { p:[0.2, 2.9, 7.4], t:[0, 3.6, 0] },
  top:   { p:[0, 17, 6.2], t:[0, 0, 3.2] },
};
let tween = null;
function go(name, instant) {
  const v = VIEWS[name]; const p = new THREE.Vector3(...v.p), t = new THREE.Vector3(...v.t);
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === name));
  if (instant) { camera.position.copy(p); controls.target.copy(t); controls.update(); return; }
  tween = { p0:camera.position.clone(), t0:controls.target.clone(), p, t, k:0 };
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
document.getElementById('spin').addEventListener('click', e => { controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = .8; e.currentTarget.setAttribute('aria-pressed', controls.autoRotate); });

function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

let dimsGroup = null;
build().then(() => {
  dimsGroup = scene.children.find(o => o.isGroup && o.visible === false);
  document.getElementById('dims').addEventListener('click', e => { dimsGroup.visible = !dimsGroup.visible; e.currentTarget.setAttribute('aria-pressed', dimsGroup.visible); });
  window.__ready = true;
}).catch(err => { document.getElementById('load').textContent = 'Could not load the set artwork'; console.error(err); });
go('front', true);

renderer.setAnimationLoop(() => {
  if (tween) { tween.k = Math.min(1, tween.k + .035); const e = 1 - Math.pow(1 - tween.k, 3);
    camera.position.lerpVectors(tween.p0, tween.p, e); controls.target.lerpVectors(tween.t0, tween.t, e); if (tween.k >= 1) tween = null; }
  controls.update(); renderer.render(scene, camera);
});

</script>
