<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Grand Royal Gameweek: Studio Set">
<meta property="og:image" content="assets/preview.jpg">
<title>Grand Royal Gameweek Studio Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&family=EB+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --rg:#e5b83d; --rb:#1f295c; --ink:#f3ece3; --bg:#0b0b0c; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; font-family:"Red Hat Display", system-ui, sans-serif; }
  #stage { position:relative; width:100%; height:100%; min-height:520px; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:absolute; left:16px; top:14px; color:var(--ink); pointer-events:none; }
  .hud h1 { margin:0; font:700 20px/1.1 "EB Garamond", Georgia, serif; letter-spacing:.01em; }
  .hud p { margin:4px 0 0; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--rg); }
  .bar { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:calc(100% - 32px); }
  .bar button { font:500 13px/1 "Red Hat Display", system-ui, sans-serif; color:var(--ink); background:rgba(20,20,24,.78); border:1px solid rgba(229,184,61,.45); padding:9px 13px; border-radius:2px; cursor:pointer; backdrop-filter:blur(6px); }
  .bar button[aria-pressed="true"] { background:var(--rg); color:var(--rb); border-color:var(--rg); }
  .bar button:focus-visible { outline:2px solid var(--rg); outline-offset:2px; }
  .sets { position:absolute; left:16px; top:76px; display:flex; flex-wrap:wrap; gap:6px; max-width:calc(100% - 32px); }
  .sets button { font:600 13px/1 "Red Hat Display", system-ui, sans-serif; color:var(--ink); background:rgba(20,20,24,.78); border:1px solid rgba(229,184,61,.45); padding:9px 13px; border-radius:2px; cursor:pointer; }
  .sets button[aria-pressed="true"] { background:var(--rg); color:var(--rb); border-color:var(--rg); }
  .sets button:focus-visible { outline:2px solid var(--rg); outline-offset:2px; }
  .hint { position:absolute; right:16px; top:16px; font-size:12px; color:rgba(243,236,227,.6); pointer-events:none; }
  #load { position:absolute; inset:0; display:grid; place-items:center; color:var(--rg); font-size:13px; letter-spacing:.2em; text-transform:uppercase; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="load">Building the set…</div>
  <div class="hud"><h1>Grand Royal Gameweek</h1><p id="setname">Studio set · Option A-1</p></div>
  <div class="hint">Drag to orbit · scroll to zoom</div>
  <div class="sets" role="group" aria-label="Set option">
    <button data-opt="A1" aria-pressed="true">A-1 · Classic · 4 ft KV</button>
    <button data-opt="A2" aria-pressed="false">A-2 · Classic · 8 ft KV</button>
    <button data-opt="B1" aria-pressed="false">B-1 · Lounge · 4 ft KV</button>
    <button data-opt="B2" aria-pressed="false">B-2 · Lounge · 8 ft KV</button>
    <button data-opt="C" aria-pressed="false">C · Lounge · players crown</button>
  </div>
  <div class="bar" role="toolbar" aria-label="Camera views">
    <button data-view="front" aria-pressed="true">Front</button>
    <button data-view="left">Left · KV &amp; shelf</button>
    <button data-view="right">Right · Brand KV &amp; board</button>
    <button data-view="host">Host seat</button>
    <button data-view="top">Plan</button>
    <button id="hosts" aria-pressed="false">Show hosts</button>
    <button id="dims" aria-pressed="false">Dimensions</button>
    <button id="spin" aria-pressed="false">Turntable</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---- sources: the design system's own files ---- */
const TEX = {"kvWall": "assets/master-kv-wall.jpg", "kvWall8": "assets/master-kv-wall-8ft.jpg", "logo": "assets/game-on-logo.png", "kvWallNP": "assets/master-kv-wall-no-players.jpg", "players": "assets/players-crown.png"};

/* ---- set dimensions, in feet (backdrop 8 ft, side walls 4 ft, curtains 4 ft) ---- */
const H = 6.5;                 // wall height, estimated from the photo
const SPLAY = THREE.MathUtils.degToRad(10);   // side walls open slightly toward camera
const CURTAIN_SPLAY = SPLAY;   // curtains run on at ~100° from the backdrop, just past square
const GOLD = 0xe5b83d, BLUE = 0x1f295c;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
scene.fog = new THREE.Fog(0x0b0b0c, 22, 40);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 3; controls.maxDistance = 24;

const loader = new THREE.TextureLoader();
const loadTex = (url) => new Promise((res, rej) => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t); }, undefined, rej));
const loadImg = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });

const std = (o) => new THREE.MeshStandardMaterial(o);
const M = {
  oak: std({ color:0xc8915f, roughness:.62 }),
  oakDark: std({ color:0x3b2416, roughness:.9 }),
  velvet: std({ color:0x111114, roughness:1 }),
  brass: std({ color:0xc9a24a, metalness:.95, roughness:.28 }),
  black: std({ color:0x0d0d0f, metalness:.6, roughness:.35 }),
  walnut: std({ color:0x7a3f22, roughness:.42 }),
  carpet: std({ color:0x46505f, roughness:1 }),
  ceiling: std({ color:0x2a2928, roughness:1 }),
  curtain: std({ color:0x857c5c, roughness:.75, metalness:.05, side:THREE.DoubleSide }),
  white: std({ color:0xf1efea, roughness:.5 }),
  leaf: std({ color:0x4f7a46, roughness:.7 }),
  gold: std({ color:GOLD, roughness:.45 }),
  goldDeep: std({ color:0xb88c2a, roughness:.5 }),
  wallEdge: std({ color:0x1c1a18, roughness:.8 }),
};

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

async function build() {
  await Promise.all([document.fonts.load('700 120px "Red Hat Display"'), document.fonts.load('500 40px "Red Hat Display"')]).catch(()=>{});
  const [kvWall, kvWall8, logoTex, kvWallNP, playersTex] = await Promise.all([loadTex(TEX.kvWall), loadTex(TEX.kvWall8), loadTex(TEX.logo), loadTex(TEX.kvWallNP), loadTex(TEX.players)]);

  /* floor + ceiling */
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(18, 14), M.carpet);
  floor.rotation.x = -Math.PI/2; floor.position.set(0, 0, 4.5); floor.receiveShadow = true; scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(16, 10), M.ceiling);
  ceil.rotation.x = Math.PI/2; ceil.position.set(0, H, 3.5); scene.add(ceil);

  /* ---- main backdrop: 8 ft slatted oak ---- */
  const back = new THREE.Mesh(new THREE.BoxGeometry(8, H, .12), M.oakDark);
  back.position.set(0, H/2, -.06); back.receiveShadow = true; scene.add(back);
  const SLATS = 44, pitch = 8 / SLATS, slatGeo = new THREE.BoxGeometry(pitch * .62, H, .09);
  const slats = new THREE.InstancedMesh(slatGeo, M.oak, SLATS);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  for (let i = 0; i < SLATS; i++) {
    m4.makeTranslation(-4 + pitch * (i + .5), H/2, .045); slats.setMatrixAt(i, m4);
    col.setHSL(.075, .45, .52 + (Math.sin(i * 12.9898) * 43758.5453 % 1) * .05); slats.setColorAt(i, col);
  }
  slats.receiveShadow = true; scene.add(slats);


  /* ---- programme lightbox: die-cut backlit "GAME ON" sign, ~26 in tall, its text above seated head height ---- */
  const SH = 2.2, SW = SH * 0.942, SY = 5.2;        // height, width (badge aspect), centre height
  const signG = new THREE.Group(); signG.position.set(0, SY, .2); scene.add(signG);
  const glowTex = canvasTex(512, 512, (g, w) => { const gr = g.createRadialGradient(w/2, w/2, w*.18, w/2, w/2, w/2); gr.addColorStop(0, 'rgba(255,205,110,.9)'); gr.addColorStop(.45, 'rgba(255,175,70,.35)'); gr.addColorStop(1, 'rgba(255,150,40,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w); });
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(SW * 2.0, SH * 1.9), new THREE.MeshBasicMaterial({ map:glowTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
  halo.position.set(0, 0, -.12); signG.add(halo);
  const backPlate = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ map:logoTex, color:0x000000, transparent:true, alphaTest:.5 }));
  backPlate.position.set(.03, -.04, -.06); signG.add(backPlate);                                       // dark edge / depth behind the face
  const face = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ map:logoTex, toneMapped:false, transparent:true, alphaTest:.5 }));   // backlit: shows the artwork's exact colours
  signG.add(face);
  [[-.55, .7], [.55, .7], [-.6, -.7], [.6, -.7]].forEach(([x, y]) => { const st = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .2, 12), M.brass); st.rotation.x = Math.PI/2; st.position.set(x * SW / 1.4, y * SH / 1.6, -.1); signG.add(st); });
  const signLight = new THREE.PointLight(0xffc35a, 7, 6, 1.6); signLight.position.set(0, SY - .2, 1.0); scene.add(signLight);

  /* ---- option C: die-cut "crown with players" panel on the backdrop, just under the sign ---- */
  const playersG = new THREE.Group(); playersG.name = 'playersC'; playersG.visible = false; scene.add(playersG);
  const PW = 7.0, PH = PW * 678 / 1548, PTOP = SY - SH/2 + .22;     // ~7 ft wide; crown tips tuck behind the sign
  const pPlate = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), new THREE.MeshBasicMaterial({ map:playersTex, color:0x000000, transparent:true, opacity:.55, alphaTest:.5, depthWrite:false }));
  pPlate.position.set(.05, PTOP - PH/2 - .06, .1); playersG.add(pPlate);                                // soft drop shadow on the slats
  const pFace = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), std({ map:playersTex, roughness:.55, transparent:true, alphaTest:.5 }));
  pFace.position.set(0, PTOP - PH/2, .14); playersG.add(pFace);

  /* ---- side walls: layout 1 = 4 ft KV + 4 ft curtain each side; layout 2 = 8 ft KV each side ---- */
  const placeholder = (ft) => canvasTex(ft === 8 ? 2400 : 1200, 1950, (g, w, h) => {
    g.fillStyle = '#f4f1ea'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#1f295c'; g.lineWidth = 8; g.setLineDash([48, 30]); g.strokeRect(60, 60, w - 120, h - 120);
    g.fillStyle = '#1f295c'; g.textAlign = 'center';
    g.font = '700 150px "Red Hat Display", Arial, sans-serif'; g.fillText('BRAND KV', w/2, h*.40);
    g.font = '500 54px "Red Hat Display", Arial, sans-serif'; g.fillText(ft + ' ft wall · artwork to come', w/2, h*.40 + 100);
  });
  const brand8 = placeholder(8);
  const dirOf = (side) => new THREE.Vector3(Math.sin(SPLAY) * side, 0, Math.cos(SPLAY));
  function sideWall(side, tex, len, parent) {             // side: -1 left, +1 right
    const hinge = new THREE.Vector3(4 * side, 0, 0), dir = dirOf(side);
    const g = new THREE.Group();
    g.position.copy(hinge).addScaledVector(dir, len / 2); g.position.y = H/2;
    g.rotation.y = side < 0 ? (Math.PI/2 - SPLAY) : -(Math.PI/2 - SPLAY);
    const mats = [M.wallEdge, M.wallEdge, M.wallEdge, M.wallEdge, std({ map:tex, roughness:.85 }), M.wallEdge];
    const box = new THREE.Mesh(new THREE.BoxGeometry(len, H, .16), mats);
    box.position.z = -.08; box.receiveShadow = true; g.add(box); parent.add(g);
  }
  const endL = new THREE.Vector3(-4, 0, 0).addScaledVector(dirOf(-1), 4);
  const endR = new THREE.Vector3(4, 0, 0).addScaledVector(dirOf(1), 4);
  function curtain(start, side, parent) {
    const dir = dirOf(side);
    const geo = new THREE.PlaneGeometry(4, H, 160, 1), p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) { const x = p.getX(i); p.setZ(i, .11 * Math.sin(x * 9.4) + .04 * Math.sin(x * 23 + 1) + .1); }
    geo.computeVertexNormals();
    const c = new THREE.Mesh(geo, M.curtain);
    c.position.copy(start).addScaledVector(dir, 2); c.position.y = H/2;
    c.rotation.y = side < 0 ? (Math.PI/2 - SPLAY) : -(Math.PI/2 - SPLAY);
    c.castShadow = c.receiveShadow = true; parent.add(c);
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, 4.2, 12), M.black);
    rod.rotation.z = Math.PI/2; rod.position.set(0, H/2 - .05, .3); c.add(rod);
  }
  const walls4 = new THREE.Group(); walls4.name = 'walls4'; scene.add(walls4);
  sideWall(-1, kvWall, 4, walls4); sideWall(+1, kvWall, 4, walls4);          // master KV both sides
  curtain(endL, -1, walls4); curtain(endR, +1, walls4);
  const walls8 = new THREE.Group(); walls8.name = 'walls8'; walls8.visible = false; scene.add(walls8);
  sideWall(-1, kvWall8, 8, walls8); sideWall(+1, brand8, 8, walls8);         // 8 ft master KV | 8 ft Brand KV
  const yellow = canvasTex(64, 64, (g, w, h) => { g.fillStyle = '#f3b137'; g.fillRect(0, 0, w, h); });   // plain KV yellow
  const wallsC = new THREE.Group(); wallsC.name = 'wallsC'; wallsC.visible = false; scene.add(wallsC);
  sideWall(-1, yellow, 4, wallsC); sideWall(+1, kvWallNP, 4, wallsC);        // plain yellow (shelf wall) | master KV without players
  curtain(endL, -1, wallsC); curtain(endR, +1, wallsC);

  /* helper: a rod between two points */
  function rod(a, b, r, mat, parent) {
    const d = b.clone().sub(a), m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 10), mat);
    m.position.copy(a).addScaledVector(d, .5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    m.castShadow = true; parent.add(m); return m;
  }

  /* ---- tactical board on a tripod easel: right side, after the Brand KV, at the curtain ---- */
  const dirR = new THREE.Vector3(Math.sin(CURTAIN_SPLAY), 0, Math.cos(CURTAIN_SPLAY));
  const inwardR = new THREE.Vector3(-Math.cos(CURTAIN_SPLAY), 0, Math.sin(CURTAIN_SPLAY));
  const easelPos = endR.clone().addScaledVector(dirR, 2.6).addScaledVector(inwardR, .7);
  const easel = new THREE.Group(); easel.position.copy(easelPos);
  const lookE = new THREE.Vector3(-1.2, 0, 9).sub(easelPos); easel.rotation.y = Math.atan2(lookE.x, lookE.z);
  scene.add(easel);
  const BW = 2.0, BH = 2.8, BY = 2.75;          // board 2 x 2.8 ft, bottom edge at 2.75 ft
  const pitchTex = canvasTex(1000, 1400, (g, w, h) => {
    g.fillStyle = '#f8f8f6'; g.fillRect(0, 0, w, h);
    const m = 60, L = m, T = m, W = w - 2*m, Hh = h - 2*m;
    g.strokeStyle = '#3b4048'; g.lineWidth = 6; g.lineCap = 'round';
    g.strokeRect(L, T, W, Hh);
    g.beginPath(); g.moveTo(L, h/2); g.lineTo(L + W, h/2); g.stroke();
    g.beginPath(); g.arc(w/2, h/2, 115, 0, Math.PI*2); g.stroke();
    g.fillStyle = '#3b4048'; g.beginPath(); g.arc(w/2, h/2, 8, 0, Math.PI*2); g.fill();
    [[T, 1], [T + Hh, -1]].forEach(([y0, s]) => {
      g.strokeRect(w/2 - 280, s > 0 ? y0 : y0 - 230, 560, 230);
      g.strokeRect(w/2 - 125, s > 0 ? y0 : y0 - 90, 250, 90);
      g.beginPath(); g.arc(w/2, y0 + s*165, 7, 0, Math.PI*2); g.fill();
      g.beginPath(); g.arc(w/2, y0 + s*165, 95, s > 0 ? .25*Math.PI : 1.25*Math.PI, s > 0 ? .75*Math.PI : 1.75*Math.PI); g.stroke();
      g.strokeRect(w/2 - 60, s > 0 ? y0 - 26 : y0, 120, 26);
    });
    const mag = (x, y, c, n, ink) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, 24, 0, Math.PI*2); g.fill();
      g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 2; g.stroke(); g.fillStyle = ink; g.font = '700 22px "Red Hat Display", Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(n, x, y + 1); };
    const red = [[500,175],[300,330],[440,360],[600,350],[720,320],[330,520],[500,470],[680,520],[420,600],[600,610],[260,640]];
    const yel = [[500,1225],[290,1060],[430,1080],[580,1070],[730,1050],[350,880],[520,930],[700,880],[440,800],[620,790],[760,760]];
    red.forEach(([x, y], i) => mag(x, y, '#d6323b', i + 1, '#fff'));
    yel.forEach(([x, y], i) => mag(x, y, '#f1c232', i + 1, '#1c1c1c'));
    for (let i = 0; i < 6; i++) { mag(110, 150 + i*58, '#d6323b', 12 + i, '#fff'); mag(110, 900 + i*58, '#f1c232', 12 + i, '#1c1c1c'); }
    const arrow = (pts) => { g.strokeStyle = '#111'; g.lineWidth = 5; g.beginPath(); g.moveTo(...pts[0]);
      g.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]); g.stroke();
      const [x1, y1] = pts[1], [x2, y2] = pts[2], a = Math.atan2(y2 - y1, x2 - x1);
      g.beginPath(); g.moveTo(x2, y2); g.lineTo(x2 - 26*Math.cos(a - .45), y2 - 26*Math.sin(a - .45)); g.moveTo(x2, y2); g.lineTo(x2 - 26*Math.cos(a + .45), y2 - 26*Math.sin(a + .45)); g.stroke(); };
    arrow([[430, 1080], [380, 760], [440, 440]]); arrow([[730, 1050], [840, 800], [760, 560]]); arrow([[520, 930], [610, 760], [500, 640]]);
    g.setLineDash([16, 14]); g.strokeStyle = '#111'; g.lineWidth = 4; g.beginPath(); g.moveTo(350, 880); g.lineTo(560, 820); g.stroke(); g.setLineDash([]);
    g.font = '700 46px "Red Hat Display", Arial'; g.fillStyle = '#111'; g.fillText('×', 250, 760);
  });
  const frameM = std({ color:0x16171a, metalness:.7, roughness:.35 });
  const boardBack = new THREE.Mesh(new THREE.BoxGeometry(BW + .14, BH + .14, .07), frameM);
  boardBack.position.set(0, BY + BH/2, 0); boardBack.castShadow = true; easel.add(boardBack);
  const boardFace = new THREE.Mesh(new THREE.PlaneGeometry(BW, BH), std({ map:pitchTex, roughness:.25, metalness:0 }));
  boardFace.position.set(0, BY + BH/2, .037); easel.add(boardFace);
  const tray = new THREE.Mesh(new THREE.BoxGeometry(BW * .7, .05, .16), frameM); tray.position.set(0, BY - .05, .07); easel.add(tray);
  const pen = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .45, 10), std({ color:0x111111, roughness:.6 }));
  pen.rotation.z = Math.PI/2; pen.position.set(.35, BY - .005, .08); easel.add(pen);
  const apex = new THREE.Vector3(0, BY + .25, -.12);
  rod(apex, new THREE.Vector3(-.8, 0, .5), .03, frameM, easel);
  rod(apex, new THREE.Vector3(.8, 0, .5), .03, frameM, easel);
  rod(apex, new THREE.Vector3(0, 0, -1.0), .03, frameM, easel);
  rod(apex, new THREE.Vector3(0, BY + BH * .75, -.08), .025, frameM, easel);
  [[-.8, .5], [.8, .5], [0, -1.0]].forEach(([x, z]) => { const f = new THREE.Mesh(new THREE.SphereGeometry(.05, 10, 8), frameM); f.position.set(x, .03, z); easel.add(f); });
  const boardLight = new THREE.SpotLight(0xfff0d8, 11, 10, .3, .7, 1.4);
  boardLight.position.set(easelPos.x - 2.2, H - .2, easelPos.z + 2.4); boardLight.target = boardFace; scene.add(boardLight);

  /* ---- track lights ---- */
  const rail = new THREE.Mesh(new THREE.BoxGeometry(5.6, .08, .1), M.black); rail.position.set(0, H - .06, 1.15); scene.add(rail);
  [[-2.65, -2.98], [-1.7, -1.3], [1.7, 1.3], [2.65, 2.98]].forEach(([x, tx], i) => {
    const target = new THREE.Object3D(); target.position.set(tx, i === 0 || i === 3 ? 3.0 : 2.6, i === 0 || i === 3 ? .7 : 0); scene.add(target);
    const head = new THREE.Mesh(new THREE.CylinderGeometry(.13, .16, .5, 24), M.black);
    head.position.set(x, H - .38, 1.15); head.lookAt(target.position); head.rotateX(Math.PI/2); scene.add(head);
    const lens = new THREE.Mesh(new THREE.CircleGeometry(.12, 24), new THREE.MeshBasicMaterial({ color:0xfff4dc }));
    lens.position.set(0, -.255, 0); lens.rotation.x = Math.PI/2; head.add(lens);
    const s = new THREE.SpotLight(0xffe0b0, 55, 16, .55, .7, 1.4);
    s.position.set(x, H - .45, 1.15); s.target = target;
    if (i === 1 || i === 2) { s.castShadow = true; s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -.0004; }
    scene.add(s);
  });


  /* ---- product shelves: two floating oak shelves on each side of the backdrop ---- */
  const shelfG = new THREE.Group(); shelfG.name = 'shelves'; scene.add(shelfG);

  const shade = new THREE.Mesh(new THREE.SphereGeometry(.5, 40, 16, 0, Math.PI*2, 0, Math.PI*.5), std({ color:0xc9a24a, metalness:.9, roughness:.3, side:THREE.DoubleSide })); shade.position.set(1.5, 4.7, 5.05); loungeG.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(.15, 16, 12), new THREE.MeshBasicMaterial({ color:0xfff1cf })); bulb.position.set(1.5, 4.5, 5.05); loungeG.add(bulb);
  const lampL = new THREE.PointLight(0xffc98a, 14, 9, 1.6); lampL.position.set(1.5, 4.3, 5.05); lampL.castShadow = true; lampL.shadow.mapSize.set(512, 512); loungeG.add(lampL);

  // leafy plant in the gap behind the left join
  const PX = -1.5, PZ = .55;
  const potL = new THREE.Mesh(new THREE.CylinderGeometry(.36, .3, .8, 32), std({ color:0xe9e3d8, roughness:.6 })); potL.position.set(PX, .4, PZ); loungeG.add(potL);
  for (let i = 0; i < 13; i++) {
    const a = i * 2.4, h = 1.7 + (i % 5) * .32, r = .25 + (i % 3) * .16;
    const tip = new THREE.Vector3(PX + Math.cos(a) * r, h, PZ + Math.abs(Math.sin(a)) * r * .9);
    rod(new THREE.Vector3(PX, .8, PZ), tip, .016, std({ color:0x3f5f35 }), loungeG);
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(.38, 16, 10), M.leaf); leaf.scale.set(1, .18, .62); leaf.position.copy(tip); leaf.rotation.set(.5 * Math.sin(a), a, .4 * Math.cos(a)); leaf.castShadow = true; loungeG.add(leaf);
  }

  // warm LED strip along the foot of the backdrop
  const led = new THREE.Mesh(new THREE.BoxGeometry(7.9, .05, .05), new THREE.MeshBasicMaterial({ color:0xffc864 })); led.position.set(0, .07, .14); loungeG.add(led);
  [-2.6, 0, 2.6].forEach(x => { const p = new THREE.PointLight(0xffb84d, 4, 3.2, 1.8); p.position.set(x, .2, .35); loungeG.add(p); });

  // seated hosts, relaxed, each facing along their module
  const hostsL = new THREE.Group(); hostsL.name = 'hosts-lounge'; hostsL.visible = false; scene.add(hostsL);
  loungeG.updateMatrixWorld(true);
  figure({ x: 0, z: SZ + .1, yaw: 0, dy: -.26, lean: .14 }, hostsL);
  sideMods.forEach(m => { const p = m.g.localToWorld(new THREE.Vector3(m.sc, 0, .1)); figure({ x: p.x, z: p.z, yaw: m.th, dy: -.26, lean: .14 }, hostsL); });

  /* ---- room light ---- */
  scene.add(new THREE.HemisphereLight(0xfff0dc, 0x232833, .55));
  const fill = new THREE.DirectionalLight(0xffe6c8, .55); fill.position.set(2, 5, 12); scene.add(fill);

  /* ---- dimension guides ---- */
  const dims = new THREE.Group(); dims.name = 'dims'; dims.visible = false; scene.add(dims);
  const lineM = new THREE.LineBasicMaterial({ color:GOLD });
  function label(text, pos, into = dims) {
    const t = canvasTex(512, 128, (g, w, h) => { g.fillStyle = 'rgba(11,11,12,.82)'; g.fillRect(0, 0, w, h); g.strokeStyle = '#e5b83d'; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4); g.fillStyle = '#f3ece3'; g.font = '600 52px "Red Hat Display", Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w/2, h/2 + 2); });
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, depthTest:false })); s.scale.set(1.9, .475, 1); s.position.copy(pos); s.renderOrder = 10; into.add(s);
  }
  function seg(a, b, text, into = dims) {
    a = a.clone(); b = b.clone(); a.y = b.y = .03;
    into.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), lineM));
    label(text, a.clone().lerp(b, .5).add(new THREE.Vector3(0, .5, 0)), into);
  }
  const d4 = new THREE.Group(); d4.name = 'dims4'; const d8 = new THREE.Group(); d8.name = 'dims8'; const dC = new THREE.Group(); dC.name = 'dimsC'; dims.add(d4, d8, dC);
  seg(new THREE.Vector3(-4, 0, .25), new THREE.Vector3(4, 0, .25), 'Backdrop 8 ft');
  const L0 = new THREE.Vector3(-4, 0, 0), R0 = new THREE.Vector3(4, 0, 0);
  seg(L0, endL, 'Master KV 4 ft', d4); seg(R0, endR, 'Master KV 4 ft', d4);
  seg(endL, endL.clone().addScaledVector(dirOf(-1), 4), 'Curtain 4 ft', d4); seg(endR, endR.clone().addScaledVector(dirOf(1), 4), 'Curtain 4 ft', d4);
  seg(L0, L0.clone().addScaledVector(dirOf(-1), 8), 'Master KV 8 ft', d8); seg(R0, R0.clone().addScaledVector(dirOf(1), 8), 'Brand KV 8 ft', d8);
  seg(L0, endL, 'Yellow wall 4 ft', dC); seg(R0, endR, 'Master KV 4 ft', dC);
  seg(endL, endL.clone().addScaledVector(dirOf(-1), 4), 'Curtain 4 ft', dC); seg(endR, endR.clone().addScaledVector(dirOf(1), 4), 'Curtain 4 ft', dC);
  const dS = new THREE.Group(); dS.name = 'dimsShelf'; dims.add(dS);
  label('Stand shelf 1.9 × 5.4 ft', new THREE.Vector3(-2.98, 5.95, .9), dS);
  label('Stand shelf 1.9 × 5.4 ft', new THREE.Vector3(cL.x + .3, 5.95, cL.z), dC);
  label('Players crown 7 × 3 ft', new THREE.Vector3(0, PTOP - PH - .35, .6), dC);
  label('Lightbox 26 in', new THREE.Vector3(0, SY + SH/2 + .35, .5));
  label('Tactical board 2 × 2.8 ft', new THREE.Vector3(easelPos.x, BY + BH + .5, easelPos.z));

  document.getElementById('load').remove();
}

/* ---- camera views ---- */
const VIEWS = {
  front: { p:[-0.4, 4.6, 18.5], t:[-0.4, 2.9, 2.4] },
  left:  { p:[3.4, 4.1, 12.2], t:[-4.9, 3.0, 3.6] },
  right: { p:[-3.4, 4.1, 12.2], t:[4.9, 3.0, 3.6] },
  host:  { p:[0.2, 3.3, 9.0], t:[0, 3.2, 1.0] },
  top:   { p:[0, 17, 6.2], t:[0, 0, 3.2] },
};
let tween = null;
function go(name, instant) {
  const v = VIEWS[name]; const p = new THREE.Vector3(...v.p), t = new THREE.Vector3(...v.t);
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === name));
  if (instant) { camera.position.copy(p); controls.target.copy(t); controls.update(); return; }
  tween = { p0:camera.position.clone(), t0:controls.target.clone(), p, t, k:0 };
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
document.getElementById('spin').addEventListener('click', e => { controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = .8; e.currentTarget.setAttribute('aria-pressed', controls.autoRotate); });

function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

const OPTS = { A1:'Classic · 4 ft master KV both sides', A2:'Classic · 8 ft master KV + 8 ft Brand KV', B1:'Lounge · 4 ft master KV both sides', B2:'Lounge · 8 ft master KV + 8 ft Brand KV', C:'Lounge · yellow shelf wall + players crown' };
const qs = new URLSearchParams(location.search);
let dimsGroup = null, hostsOn = false, OPT = (qs.get('opt') || '').toUpperCase();
if (!OPTS[OPT]) OPT = qs.get('set') === 'lounge' ? 'B1' : 'A1';
function applySet() {
  const C = OPT === 'C', L = OPT[0] === 'B' || C, W8 = OPT[1] === '2';
  scene.getObjectByName('classic').visible = !L; scene.getObjectByName('lounge').visible = L;
  scene.getObjectByName('hosts-classic').visible = hostsOn && !L; scene.getObjectByName('hosts-lounge').visible = hostsOn && L;
  scene.getObjectByName('walls4').visible = !W8 && !C; scene.getObjectByName('walls8').visible = W8; scene.getObjectByName('wallsC').visible = C;
  scene.getObjectByName('dims4').visible = !W8 && !C; scene.getObjectByName('dims8').visible = W8; scene.getObjectByName('dimsC').visible = C;
  scene.getObjectByName('dimsShelf').visible = !C; scene.getObjectByName('shelvesStd').visible = !C; scene.getObjectByName('shelvesC').visible = C;
  scene.getObjectByName('playersC').visible = C;
  document.querySelectorAll('[data-opt]').forEach(b => b.setAttribute('aria-pressed', b.dataset.opt === OPT));
  document.getElementById('setname').textContent = 'Option ' + (C ? 'C' : OPT[0] + '-' + OPT[1]) + ' · ' + OPTS[OPT];
}
build().then(() => {
  dimsGroup = scene.getObjectByName('dims');
  document.getElementById('hosts').addEventListener('click', e => { hostsOn = !hostsOn; e.currentTarget.setAttribute('aria-pressed', hostsOn); applySet(); });
  document.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => { OPT = b.dataset.opt; applySet(); }));
  applySet();
  document.getElementById('dims').addEventListener('click', e => { dimsGroup.visible = !dimsGroup.visible; e.currentTarget.setAttribute('aria-pressed', dimsGroup.visible); });
  window.__ready = true;
}).catch(err => { document.getElementById('load').textContent = 'Could not load the set artwork'; console.error(err); });
go('front', true);

renderer.setAnimationLoop(() => {
  if (tween) { tween.k = Math.min(1, tween.k + .035); const e = 1 - Math.pow(1 - tween.k, 3);
    camera.position.lerpVectors(tween.p0, tween.p, e); controls.target.lerpVectors(tween.t0, tween.t, e); if (tween.k >= 1) tween = null; }
  controls.update(); renderer.render(scene, camera);
});

</script>
</body>
</html>
